name: Installation checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Compose version
        run: docker compose version
      - name: Test installer safety and real Compose integration
        run: python3 -m unittest discover -s tests -v
      - name: Install Ansible for syntax validation
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install 'ansible-core==2.19.3'
      - name: Validate playbook and inventory
        run: .venv/bin/ansible-playbook -i ansible/inventory.example.yml ansible/install.yml --syntax-check
      - name: Verify Ansible inventory settings and repeat runs in temporary fixtures
        run: sudo -n .venv/bin/python scripts/test-ansible.py
      - name: Verify mailcow routes and internal listeners with nginx
        run: .venv/bin/python scripts/test-nginx.py
      - name: Check the offline showcase is current
        run: |
          python3 scripts/package-showcase.py
          git diff --exit-code --quiet -- docs/mailcow-modern-ui-showcase.html

  release:
    name: Publish community preview
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify the release tag and public images
        run: python3 scripts/check-release.py --tag "$GITHUB_REF_NAME"
      - name: Prepare release assets
        run: |
          mkdir release-assets
          cp deploy/release.json docs/mailcow-modern-ui-showcase.html release-assets/
          cd release-assets
          sha256sum release.json mailcow-modern-ui-showcase.html > SHA256SUMS
      - name: Publish the GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          title="$(python3 -c 'import json; print(json.load(open("deploy/release.json"))["name"])')"
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --title "mailcow Modern UI — $title" \
            --notes-file "docs/releases/$version.md" --prerelease --latest=false

  release-notes:
    name: Update published preview notes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Published tags, image pins, and release assets stay fixed; documentation can be corrected.
      - name: Sync corrected notes for existing previews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          def gh(*args):
              return json.loads(subprocess.check_output(["gh", *args], text=True))

          releases = gh("release", "list", "--exclude-drafts", "--limit", "100", "--json", "tagName")
          for release in releases:
              tag = release["tagName"]
              if not re.fullmatch(r"v0\.\d+\.\d+-preview\.[1-9]\d*", tag):
                  continue
              notes = Path("docs/releases") / (tag[1:] + ".md")
              if not notes.is_file():
                  continue
              current = gh("release", "view", tag, "--json", "body")["body"]
              if current.strip() != notes.read_text().strip():
                  subprocess.run(["gh", "release", "edit", tag, "--notes-file", str(notes)], check=True)
                  print("Updated release notes: " + tag)
          PY
